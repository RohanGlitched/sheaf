name: Keeper

# A backup trigger, not the scheduler. The keeper (/api/keeper: run due plans,
# fill fair dollar orders, refund expired ones) and the EVM keeper are called
# every minute by two Google Cloud Scheduler jobs. GitHub's cron below often
# runs late or is skipped under load, so it is only a fallback for when those
# jobs are paused; it can also be run by hand (Actions > Keeper > Run
# workflow). Everything the keeper does is permissionless on chain.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - name: Run the keeper
        run: curl -fsS -X POST https://sheaf-index.vercel.app/api/keeper | head -c 2000
      - name: Fill dollar orders on the EVM chains
        run: curl -fsS https://sheaf-index.vercel.app/api/evm-keeper | head -c 2000
