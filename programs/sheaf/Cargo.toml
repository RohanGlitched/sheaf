[package]
name = "sheaf"
version = "0.1.0"
description = "Sheaf: permissionless in-kind index baskets for tokenized equities on Solana, with an oracle-free Dutch-auction cash desk and recurring buy plans"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sheaf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Adds the write cluster's stand-in issuer keys to KNOWN_ISSUERS. Build the
# devnet deployment with `anchor build -- --features devnet`; the default build
# knows only the real issuers.
devnet = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
spl-token-2022 = { version = "6.0.0", features = ["no-entrypoint"] }
solana-security-txt = "1.1.1"
